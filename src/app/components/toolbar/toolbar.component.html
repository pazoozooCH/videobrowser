<div class="toolbar">
  <button (click)="openFolder()">Open Folder</button>
  <button (click)="searchService.searchActive.set(!searchService.searchActive())">Search</button>
  <button [class.active]="cacheService.panelOpen()" (click)="cacheService.panelOpen.set(!cacheService.panelOpen())">Cache</button>
  <div class="spacer"></div>
  <button [class.active]="previewService.active()" (click)="togglePreview()">Preview</button>
</div>
