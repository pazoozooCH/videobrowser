@if (visible()) {
  <div class="overlay">
    <div class="dialog">
      <div class="header">
        <h3>Rename</h3>
        <button class="close" (click)="hide()" aria-label="Close">&times;</button>
      </div>

      <div class="field">
        <label>Current:</label>
        <textarea [value]="currentName()" readonly rows="1" #autoGrow></textarea>
      </div>

      <div class="field">
        <label>New:</label>
        <textarea
          class="new-name"
          [ngModel]="newName()"
          (ngModelChange)="onNewNameChange($event)"
          (keydown)="onKeydown($event)"
          rows="3"
          #newNameInput
          #autoGrow
        ></textarea>
      </div>

      <div class="field checkbox">
        <label>
          <input
            type="checkbox"
            [ngModel]="encode()"
            (ngModelChange)="encode.set($event)"
          />
          Encode
        </label>
      </div>

      <div class="actions">
        <button (click)="hide()">Cancel</button>
        <button class="primary" (click)="onRename()">Rename</button>
      </div>
    </div>
  </div>
}
